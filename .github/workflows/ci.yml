name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Buf
        run: make buf-install

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run verification
        run: make verify

      - name: Validate and generate Protobuf code
        run: make proto

      - name: Start three local processes
        run: make cluster

      - name: Stop local processes
        if: always()
        run: make stop
